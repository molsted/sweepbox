name: Sparkle update keys

# One-time bootstrap for the in-app updater (NetSparkle). The keypair is generated LOCALLY,
# so the private key never reaches GitHub's servers, logs or CI:
#   dotnet tool install --global NetSparkleUpdater.Tools.AppCastGenerator
#   netsparkle-generate-appcast --generate-keys --key-path .keys
# 1. Commit .keys/NetSparkle_Ed25519.pub as installer/sparkle-public-key.txt (e.g. via a PR).
# 2. Copy .keys/NetSparkle_Ed25519.priv into the SPARKLE_PRIVATE_KEY repository secret
#    (Settings -> Secrets and variables -> Actions), then delete the local file.
#
# This workflow only checks that the committed public key is present and decodable;
# it never generates, displays or handles private key material.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: A public key must be committed before the first release
        run: |
          if [ -s installer/sparkle-public-key.txt ] && grep -qv '^#' installer/sparkle-public-key.txt; then
            echo "Public key present: $(grep -v '^#' installer/sparkle-public-key.txt | tr -d '[:space:]')"
          else
            echo "::error::installer/sparkle-public-key.txt holds no key. Generate the keypair locally (see the header of this workflow), commit the public key and store the private key in the SPARKLE_PRIVATE_KEY secret."
            exit 1
          fi
