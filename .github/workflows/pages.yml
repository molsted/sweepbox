name: Website

# Builds the GitHub Pages site (site/ + docs/MANUAL.md + LICENSE) and deploys it.
# Runs when the site or docs change, and on every published release so the page stays current.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "LICENSE"
      - "tools/build_site.py"
      - "src/Sweepbox.Desktop/Assets/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build site
        run: |
          python3 -m pip install --quiet --require-hashes -r tools/requirements-site.txt
          python3 tools/build_site.py
        env:
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
