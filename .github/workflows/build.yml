name: Build installers

# Least privilege by default; the release job widens to contents: write.
permissions:
  contents: read

on:
  push:
    branches: [main]
    # Website-only changes are built by pages.yml; skip the app build for them.
    # (Path filters are not evaluated for tag pushes, so tags: ["v*"] below still triggers.)
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "user-docs/**"
      - "tools/build_site.py"
      - "tools/requirements-site.txt"
      - "tools/generate_site_graphics.py"
      - ".github/workflows/pages.yml"
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "user-docs/**"
      - "tools/build_site.py"
      - "tools/requirements-site.txt"
      - "tools/generate_site_graphics.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.301  # pinned: the committed lock files are generated with this exact SDK (ILLink.Tasks version tracks it)
      - run: dotnet test Sweepbox.slnx -c Release -p:RestoreLockedMode=true

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.301  # pinned: the committed lock files are generated with this exact SDK (ILLink.Tasks version tracks it)
      - name: Select newest Xcode (26+ compiles the macOS 26 app icon)
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Build app bundles and DMGs
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            artifacts/*.dmg
            artifacts/*.zip

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.301  # pinned: the committed lock files are generated with this exact SDK (ILLink.Tasks version tracks it)
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installers
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-setup
          path: artifacts/*-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    # The signing key can live in this environment's secrets, with a deployment rule limited to v* tags.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0              # needed to check the tag's commit is on main
          persist-credentials: false  # don't leave the write token on disk next to the signing key
      - name: Release only commits that are on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Releases are cut from main only."
            exit 1
          }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.301  # pinned: the committed lock files are generated with this exact SDK (ILLink.Tasks version tracks it)
      # Installed from the committed manifest (exact version), in a step that never sees the signing key.
      - name: Install the pinned appcast generator
        run: dotnet tool restore
      - name: Generate signed appcasts for the in-app updater (NetSparkle)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set. Without it the appcast is not signed, so no existing install updates to this release. Add it as a secret of the release environment (Settings -> Environments -> release) or of the repository, then delete and re-push the tag."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          export SPARKLE_PUBLIC_KEY="$(grep -v '^#' installer/sparkle-public-key.txt | tr -d '[:space:]')"
          for spec in "macos arm64 zip" "macos x64 zip" "windows x64 exe" "windows arm64 exe"; do
            set -- $spec
            mkdir -p "appcast-$1-$2"
            cp dist/*-$1-$2*.$3 "appcast-$1-$2/"
            dotnet tool run netsparkle-generate-appcast -- -a "appcast-$1-$2" -b "appcast-$1-$2" -e "$3" \
              -o "$1-$2" -u "$BASE" -n Sweepbox --file-version "$VERSION"
            mv "appcast-$1-$2/appcast.xml" "dist/appcast-$1-$2.xml"
            mv "appcast-$1-$2/appcast.xml.signature" "dist/appcast-$1-$2.xml.signature"
          done
      # Third-party action, pinned to the commit behind the v3 tag.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: Sweepbox ${{ github.ref_name }}
          body: |
            Sweepbox keeps Homebrew / Chocolatey and npm up to date and tidy on a schedule, from the menu bar (macOS) or system tray (Windows), and shows how much disk space the clean-up freed.

            | Download | For |
            |---|---|
            | `Sweepbox-*-macos-arm64.dmg` | Mac with Apple Silicon |
            | `Sweepbox-*-macos-x64.dmg` | Mac with Intel |
            | `Sweepbox-*-windows-x64-setup.exe` | Windows 10/11 (x64) |
            | `Sweepbox-*-windows-arm64-setup.exe` | Windows 11 on Arm |

            The macOS build is not notarized: on first launch right-click the app in Applications and choose **Open**. See the [manual](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/user-docs/MANUAL.md) for details.
          generate_release_notes: true
          files: dist/*
