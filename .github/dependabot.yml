version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Avalonia 12 is a breaking major release; tracked in the migration issue (#17).
      - dependency-name: "Avalonia*"
        versions: ["12.*"]
